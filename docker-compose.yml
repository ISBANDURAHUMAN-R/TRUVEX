services:
  truvex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truvex-ai-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - truvex_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  truvex_data:
    driver: local
